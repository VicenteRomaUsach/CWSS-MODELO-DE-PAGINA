name: Rebuild CWSS 03-09

on:
  push:
    paths:
      - '.github/workflows/rebuild-cwss-0309.yml'
      - '.cwss-update/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact ZIP files
        shell: bash
        run: |
          set -euo pipefail
          cat .cwss-update/site-gz.00 .cwss-update/site-gz.01 .cwss-update/site-gz.02 | base64 -d | gzip -d > site.js.new
          cat .cwss-update/css-gz.00 .cwss-update/css-gz.01 | base64 -d | gzip -d > styles.css.new
          echo 'acaf3d1a1d496396b393fbe073bbde33aa9b1c44ea9aac440e39a86be771c282  site.js.new' | sha256sum -c -
          echo '0c86c2ab8485c20e1570dd57d67ed5bb258525c9f7759e2905ac097102108290  styles.css.new' | sha256sum -c -
          mv site.js.new site.js
          mv styles.css.new styles.css
          rm -rf .cwss-update
          rm -f .github/workflows/rebuild-cwss-0309.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Completa actualización CWSS 03-09 desde ZIP'
          git push
